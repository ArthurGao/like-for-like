services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: likeforlike
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local
    ports:
      - "127.0.0.1:5482:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d likeforlike"]
      interval: 2s
      timeout: 3s
      retries: 30
